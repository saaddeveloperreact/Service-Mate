version: "3.8"

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: servicemate-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: servicemate
    networks:
      - servicemate-network

  # Backend — Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servicemate-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/servicemate
      - NODE_ENV=production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - servicemate-network

  # Frontend — React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servicemate-ui
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - servicemate-network

volumes:
  mongo_data:

networks:
  servicemate-network:
    driver: bridge
